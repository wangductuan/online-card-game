    #gameArea {

    }

    #gameArea button:hover {

    .history {

      list-style-type: none;
      padding: 0;

    .history li {
      margin-bottom: 10px;

    @media (max-width: 768px) {
      .card-img {
        width: 80px;

      p {

      #setupArea input {

    @media (max-width: 480px) {
      h1 {
        font-size: 1.2em;
      }

      .card-img {
        width: 60px;
      }

      #setupArea input {
        width: 100%;
      }

  </style>

  <p>Trò chơi này giúp bạn và người chơi khám phá những câu hỏi thú vị về tình yêu và sự hiểu biết lẫn nhau. Cùng nhau trải nghiệm và thấu hiểu sâu sắc hơn qua mỗi lá bài.</p>
  
  <div id="setupArea">
    <input type="text" id="roomId" placeholder="Nhập mã phòng (VD: room123)" />

  </div>

    <button onclick="drawCard(1)">🧔 Người chơi 1 rút</button>
    <div id="card1"><img src="back.png" class="card-img" /></div>
    <div id="question1"></div>
    <br>
    <button onclick="drawCard(2)">👩 Người chơi 2 rút</button>

    <div id="question2"></div>
    <br>

      <h3>Lịch sử rút bài:</h3>
      <ul id="historyList"></ul>

    <p id="remainingCardsCount">Số bài còn lại: <span id="cardsLeft"></span></p>

      { image: 'card9.png', question: 'Câu hỏi 9: Bạn sẽ phản ứng thế nào khi đối phương mắc sai lầm?' },

      { image: 'card13.png', question: 'Câu hỏi 13: Bạn nghĩ sao về việc duy trì một mối quan hệ lâu dài?' },

      { image: 'card21.png', question: 'Câu hỏi 21: Bạn có nghĩ rằng tình yêu cần phải có sự hy sinh?' },

      { image: 'card23.png', question: 'Câu hỏi 23: Bạn sẽ làm gì nếu đối phương thay đổi không như mong đợi?' },

      { image: 'card29.png', question: 'Câu hỏi 29: Bạn nghĩ gì về sự tôn trọng trong tình yêu?' },
      { image: 'card30.png', question: 'Câu hỏi 30: Bạn có sẵn sàng đối diện với thử thách để bảo vệ mối quan hệ không?' },
      { image: 'card31.png', question: 'Câu hỏi 31: Bạn nghĩ rằng tình yêu cần phải có sự tin tưởng?' },
      { image: 'card32.png', question: 'Câu hỏi 32: Bạn nghĩ sao về việc học hỏi và phát triển trong tình yêu?' },
      { image: 'card33.png', question: 'Câu hỏi 33: Bạn sẽ làm gì nếu đối phương không đồng ý với ý tưởng của bạn?' },
      { image: 'card34.png', question: 'Câu hỏi 34: Bạn nghĩ gì về việc tạo ra những kỷ niệm đáng nhớ trong mối quan hệ?' },
      { image: 'card35.png', question: 'Câu hỏi 35: Bạn nghĩ sao về việc đi du lịch cùng người yêu?' },
      { image: 'card36.png', question: 'Câu hỏi 36: Bạn nghĩ tình yêu có thể giúp chúng ta vượt qua khó khăn?' },
      { image: 'card37.png', question: 'Câu hỏi 37: Bạn nghĩ sao về sự lãng mạn trong tình yêu?' },
      { image: 'card38.png', question: 'Câu hỏi 38: Bạn thích cảm giác được chăm sóc và yêu thương như thế nào?' },
      { image: 'card39.png', question: 'Câu hỏi 39: Bạn nghĩ tình yêu có thể giúp chúng ta trưởng thành hơn không?' },
      { image: 'card40.png', question: 'Câu hỏi 40: Bạn nghĩ sao về việc cùng nhau xây dựng một gia đình?' },
      { image: 'card41.png', question: 'Câu hỏi 41: Bạn sẽ làm gì nếu phải lựa chọn giữa tình yêu và sự nghiệp?' },
      { image: 'card42.png', question: 'Câu hỏi 42: Bạn nghĩ gì về sự thay đổi trong mối quan hệ?' },
      { image: 'card43.png', question: 'Câu hỏi 43: Bạn nghĩ tình yêu có thể tồn tại mãi mãi?' },
      { image: 'card44.png', question: 'Câu hỏi 44: Bạn sẽ làm gì nếu đối phương yêu cầu bạn thay đổi bản thân?' },
      { image: 'card45.png', question: 'Câu hỏi 45: Bạn nghĩ sao về việc sống chung trước khi kết hôn?' },
      { image: 'card46.png', question: 'Câu hỏi 46: Bạn sẽ làm gì nếu đối phương không ủng hộ ước mơ của bạn?' },
      { image: 'card47.png', question: 'Câu hỏi 47: Bạn nghĩ gì về sự kiên nhẫn trong tình yêu?' },
      { image: 'card48.png', question: 'Câu hỏi 48: Bạn nghĩ tình yêu có thể làm cho bạn trở thành một người tốt hơn không?' },
      { image: 'card49.png', question: 'Câu hỏi 49: Bạn sẽ làm gì khi cảm thấy không còn yêu nhau nữa?' }
    ];

    let roomId = "";
    let remainingCards = [...allCards];
    let history = [];

    function createRoom() {
      const randomId = 'room_' + Math.random().toString(36).substring(2, 8).toUpperCase();
      document.getElementById("roomId").value = randomId;
      joinRoom();
    }

    window.joinRoom = function () {
      roomId = document.getElementById("roomId").value.trim();
      if (roomId === "") return alert("Vui lòng nhập mã phòng");
      document.getElementById("roomDisplay").textContent = roomId;
      document.getElementById("setupArea").classList.add("hidden");
      document.getElementById("gameArea").classList.remove("hidden");
    };

    function drawCard(player) {
      if (remainingCards.length === 0) {
        return alert("Hết bài rồi!");
      }

      const cardIndex = Math.floor(Math.random() * remainingCards.length);
      const drawnCard = remainingCards.splice(cardIndex, 1)[0];
      
      history.push({ player: player === 1 ? "Người chơi 1" : "Người chơi 2", question: drawnCard.question });

      const questionText = drawnCard.question;
      const imgSrc = drawnCard.image;

      if (player === 1) {
        document.getElementById("card1").innerHTML = `<img src="${imgSrc}" class="card-img" />`;
        document.getElementById("question1").textContent = questionText;
      } else {
        document.getElementById("card2").innerHTML = `<img src="${imgSrc}" class="card-img" />`;
        document.getElementById("question2").textContent = questionText;
      }

      updateHistory();
      updateCardsLeft();
    }

    function resetTurn() {
      document.getElementById("card1").innerHTML = "<img src='back.png' class='card-img' />";
      document.getElementById("question1").textContent = "";
      document.getElementById("card2").innerHTML = "<img src='back.png' class='card-img' />";
      document.getElementById("question2").textContent = "";
    }

    function updateHistory() {
      const historyList = document.getElementById("historyList");
      historyList.innerHTML = "";
      history.forEach(item => {
        const li = document.createElement("li");
        li.textContent = `${item.player}: ${item.question}`;
        historyList.appendChild(li);
      });
    }

    function updateCardsLeft() {
      document.getElementById("cardsLeft").textContent = remainingCards.length;
    }
  </script>
</body>
</html>
