    // Random card picker logic
    function drawCard(player) {
      const randomCard = allCards[Math.floor(Math.random() * allCards.length)];
      if (player === 1) {
        document.getElementById('card1').innerHTML = `<img src="${randomCard.image}" class="card-img" />`;
        document.getElementById('question1').innerHTML = `${randomCard.icon} ${randomCard.question}`;
      } else {
        document.getElementById('card2').innerHTML = `<img src="${randomCard.image}" class="card-img" />`;
        document.getElementById('question2').innerHTML = `${randomCard.icon} ${randomCard.question}`;
      }
    }

    function joinRoom() {
      const roomId = document.getElementById('roomId').value;
      if (roomId.trim()) {
        document.getElementById('roomDisplay').textContent = roomId;
        document.getElementById('setupArea').classList.add('hidden');
        document.getElementById('gameArea').classList.remove('hidden');
      }
    }

    function resetTurn() {
      document.getElementById('question1').innerHTML = "";
      document.getElementById('question2').innerHTML = "";
      document.getElementById('card1').innerHTML = "<img src='back.png' class='card-img' />";
