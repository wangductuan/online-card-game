      { id: 23, label: "Lá 23", question: "Bạn có nghĩ rằng tình yêu của chúng ta có thể vượt qua thử thách thời gian?", image: "cards/card23.png" },
      { id: 24, label: "Lá 24", question: "Bạn cảm thấy thế nào khi tôi dành cho bạn thời gian riêng tư?", image: "cards/card24.png" },
      { id: 25, label: "Lá 25", question: "Điều gì bạn thấy tiếc nuối khi nhìn lại quãng thời gian chúng ta yêu nhau?", image: "cards/card25.png" },
      { id: 26, label: "Lá 26", question: "Món ăn nào bạn nghĩ chúng ta nên thử cùng nhau?", image: "cards/card26.png" },
      { id: 27, label: "Lá 27", question: "Nếu chúng ta có thể sống ở bất kỳ đâu trên thế giới, bạn muốn sống ở đâu?", image: "cards/card27.png" },

      { id: 34, label: "Lá 34", question: "Điều gì trong mối quan hệ khiến bạn cảm thấy an toàn?", image: "cards/card34.png" },
      { id: 35, label: "Lá 35", question: "Bạn thích cách chúng ta giải quyết bất đồng thế nào?", image: "cards/card35.png" },
      { id: 36, label: "Lá 36", question: "Bạn có mơ ước gì cho tương lai của chúng ta không?", image: "cards/card36.png" },
      { id: 37, label: "Lá 37", question: "Chúng ta có thể làm gì để cải thiện tình cảm của mình?", image: "cards/card37.png" },
      { id: 38, label: "Lá 38", question: "Điều gì bạn cảm thấy có thể làm cho chúng ta gần gũi hơn?", image: "cards/card38.png" },
      { id: 39, label: "Lá 39", question: "Bạn nghĩ sao về việc chúng ta cùng nhau phát triển cá nhân trong mối quan hệ này?", image: "cards/card39.png" },
      { id: 40, label: "Lá 40", question: "Điều gì bạn muốn thay đổi về mình để mối quan hệ này ngày càng tốt đẹp hơn?", image: "cards/card40.png" },
      { id: 41, label: "Lá 41", question: "Điều gì bạn nghĩ là giá trị nhất trong tình yêu của chúng ta?", image: "cards/card41.png" },
      { id: 42, label: "Lá 42", question: "Nếu chúng ta có thể thực hiện một cuộc phiêu lưu cùng nhau, bạn muốn làm gì?", image: "cards/card42.png" },
      { id: 43, label: "Lá 43", question: "Bạn nghĩ gì về cách tôi thể hiện tình yêu?", image: "cards/card43.png" },
      { id: 44, label: "Lá 44", question: "Bạn muốn có một kỳ nghỉ dài cùng tôi, bạn sẽ chọn nơi nào?", image: "cards/card44.png" },
      { id: 45, label: "Lá 45", question: "Có bao giờ bạn cảm thấy không hài lòng về tôi chưa? Điều gì khiến bạn cảm thấy vậy?", image: "cards/card45.png" },
      { id: 46, label: "Lá 46", question: "Điều gì bạn thấy khác biệt giữa tình yêu của chúng ta và các cặp đôi khác?", image: "cards/card46.png" },
      { id: 47, label: "Lá 47", question: "Bạn có nghĩ rằng tình yêu có thể vượt qua tất cả khó khăn trong cuộc sống không?", image: "cards/card47.png" },
      { id: 48, label: "Lá 48", question: "Bạn cảm thấy như thế nào khi tôi bất ngờ dành cho bạn một điều ngọt ngào?", image: "cards/card48.png" },
      { id: 49, label: "Lá 49", question: "Điều gì khiến bạn cảm thấy thoải mái nhất khi bên tôi?", image: "cards/card49.png" }
    ];

    let roomId = "";
    let remainingCards = [...allCards];

    function createRoom() {
      const randomId = 'room_' + Math.random().toString(36).substring(2, 8).toUpperCase();
      document.getElementById("roomId").value = randomId;
      joinRoom();
    }

    window.joinRoom = function () {
      roomId = document.getElementById("roomId").value.trim();
      if (!roomId) return alert("Vui lòng nhập mã phòng!");
      document.getElementById("setupArea").classList.add("hidden");
      document.getElementById("gameArea").classList.remove("hidden");
      document.getElementById("roomDisplay").textContent = roomId;

      const roomRef = ref(db, "rooms/" + roomId + "/lastDraw");
      onValue(roomRef, (snapshot) => {
        const data = snapshot.val();
        if (data && data.player && data.card) showCard(data.player, data.card);
      });
    };

    window.drawCard = function(player) {
      if (remainingCards.length === 0) return alert("Hết bài rồi!");
      const idx = Math.floor(Math.random() * remainingCards.length);
      const card = remainingCards.splice(idx, 1)[0];
      set(ref(db, "rooms/" + roomId + "/lastDraw"), { player, card });
    };

    function showCard(player, card) {
      if (player === 1) {
        document.getElementById("card1").innerHTML = `<img src="${card.image}" class="card-img" />`;
        document.getElementById("question1").textContent = card.question;
      } else {
        document.getElementById("card2").innerHTML = `<img src="${card.image}" class="card-img" />`;
        document.getElementById("question2").textContent = card.question;
      }
    }

    window.resetTurn = function () {
      document.getElementById("card1").innerHTML = '<img src="back.png" class="card-img" />';
      document.getElementById("card2").innerHTML = '<img src="back.png" class="card-img" />';
      document.getElementById("question1").textContent = "";
      document.getElementById("question2").textContent = "";
    };
  </script>
</body>
</html>
