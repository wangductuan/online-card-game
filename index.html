<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Rút Bài Câu Hỏi</title>
  <!-- Link đến tệp CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🎴 Trò Chơi Rút Bài Câu Hỏi</h1>

  <div id="setupArea">
    <h2>🧑‍🤝‍🧑 Trò Chơi Bắt Đầu</h2>
    <!-- Nút này sẽ cần được điều chỉnh cho game online (chờ người chơi khác, tạo phòng,...) -->
    <button onclick="startGame()">🎮 Bắt đầu chơi</button>
  </div>

  <div id="gameArea">
    <div><strong id="counter">Còn lại: 0 / 0 lá</strong></div>

    <!-- Nút và khu vực hiển thị bài cho người chơi 1 -->
    <!-- Sự kiện onclick này sẽ cần thay đổi để gọi hàm game online -->
    <button onclick="drawCard(1)" id="btn1">🧔 Anh ấy rút</button>
    <div id="card1"><img src="back.png" class="card-img" alt="Bài úp"></div>
    <div id="question1" style="margin: 10px 0; font-weight: bold;"></div>
    <br>

    <!-- Nút và khu vực hiển thị bài cho người chơi 2 -->
    <!-- Sự kiện onclick này sẽ cần thay đổi để gọi hàm game online -->
    <button onclick="drawCard(2)" id="btn2">👩 Cô ấy rút</button>
    <div id="card2"><img src="back.png" class="card-img" alt="Bài úp"></div>
    <div id="question2" style="margin: 10px 0; font-weight: bold;"></div>
    <br>

    <!-- Nút chơi tiếp, sẽ hiển thị sau mỗi lượt -->
    <!-- Sự kiện onclick này sẽ cần thay đổi để gọi hàm game online -->
    <button id="nextBtn" onclick="resetTurn()">🔄 Chơi Tiếp</button>

    <div class="log">
      <h3>📜 Những Lá Đã Rút:</h3>
      <ul id="drawnLog"></ul>
    </div>
  </div>

  <!-- Thêm các thẻ script của Firebase SDK (sử dụng CDN) -->
  <!-- Firebase App (the core Firebase SDK) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js"></script>
  <!-- Firebase Realtime Database SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js"></script>
  <!-- Thêm các SDK khác nếu cần (ví dụ: Auth) -->
  <!-- <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js"></script> -->


  <!-- Link đến tệp JavaScript của bạn -->
  <!-- Đảm bảo tệp script.js được tải SAU các SDK của Firebase -->
  <script src="script.js"></script>
</body>
</html>
