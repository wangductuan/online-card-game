
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rút Bài Online 2 Người</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f2f2f2; }
    #setupArea, #gameArea { background: white; padding: 20px; border-radius: 10px; max-width: 600px; margin: auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    button { margin-top: 10px; padding: 10px 20px; font-size: 16px; }
    #diceResult { font-size: 24px; margin-top: 10px; }
  </style>
</head>
<body>
  <div id="setupArea">
    <h2>🧑‍🤝‍🧑 Tạo hoặc Vào Phòng</h2>
    <button onclick="createRoom()">🆕 Tạo Phòng Mới</button><br><br>
    <input type="text" id="roomInput" placeholder="Nhập mã phòng...">
    <button onclick="joinRoom()">🔗 Tham Gia Phòng</button>
    <div id="shareLink" style="margin-top: 10px;"></div>
  </div>

  <div id="gameArea" style="display:none;">
    <h2>🎲 Đổ Xúc Xắc</h2>
    <button onclick="rollDice()">🎲 Đổ xúc xắc</button>
    <div id="diceResult"></div>
    <div id="drawResult" style="margin-top: 20px;"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCig0Z7mku3A0920dAAmJ8QOAGSY2qov34",
      authDomain: "wang-2025.firebaseapp.com",
      databaseURL: "https://wang-2025-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "wang-2025",
      storageBucket: "wang-2025.appspot.com",
      messagingSenderId: "112722745227",
      appId: "1:112722745227:web:133ac984a65668b187018e",
      measurementId: "G-8W4VN0QM5T"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentRoomId = null;

    function createRoom() {
      const roomId = Math.random().toString(36).substring(2, 8);
      currentRoomId = roomId;

      set(ref(db, `rooms/${roomId}`), {
        createdAt: Date.now(),
        players: []
      }).then(() => {
        const link = `${location.origin}${location.pathname}?room=${roomId}`;
        document.getElementById("shareLink").innerHTML = `🔗 Link phòng: <a href="${link}" target="_blank">${link}</a>`;
      });
    }

    function joinRoom() {
      const roomId = document.getElementById("roomInput").value.trim();
      if (!roomId) return alert("Vui lòng nhập mã phòng!");

      get(child(ref(db), `rooms/${roomId}`)).then((snapshot) => {
        if (snapshot.exists()) {
          currentRoomId = roomId;
          alert("Tham gia phòng thành công!");
          document.getElementById("setupArea").style.display = "none";
          document.getElementById("gameArea").style.display = "block";
        } else {
          alert("Phòng không tồn tại.");
        }
      });
    }

    function rollDice() {
      const roll = Math.floor(Math.random() * 6) + 1;
      document.getElementById("diceResult").innerText = `Bạn đổ được: 🎲 ${roll}`;
      document.getElementById("drawResult").innerText = "Người thua sẽ phải rút bài!";
    }

    const urlParams = new URLSearchParams(window.location.search);
    const roomFromUrl = urlParams.get("room");
    if (roomFromUrl) {
      document.getElementById("roomInput").value = roomFromUrl;
      joinRoom();
    }
  </script>
</body>
</html>
