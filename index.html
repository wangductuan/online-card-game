<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎴 Rút Bài Thấu Hiểu Love Again by Wang 8</title>
  <style>
    /* Các style tương tự như trước */
  </style>
</head>
<body>
  <h1>🎴 Rút Bài Thấu Hiểu Love Again by Wang 8</h1>
  <p>Trò chơi này giúp bạn và người chơi khám phá những câu hỏi thú vị về tình yêu và sự hiểu biết lẫn nhau. Cùng nhau trải nghiệm và thấu hiểu sâu sắc hơn qua mỗi lá bài.</p>
  <div id="setupArea">
    <input type="text" id="roomId" placeholder="Nhập mã phòng (VD: room123)" />
    <button onclick="joinRoom()">Tham gia phòng</button><br><br>
  </div>
  <div id="gameArea" class="hidden">
    <p><strong>Phòng:</strong> <span id="roomDisplay"></span></p>
    <button onclick="drawCard(1)">🧔 Người chơi 1 rút</button>
    <div id="card1"><img src="back.png" class="card-img" /></div>
    <div id="question1"></div>
    <br>
    <button onclick="drawCard(2)">👩 Người chơi 2 rút</button>
    <div id="card2"><img src="back.png" class="card-img" /></div>
    <div id="question2"></div>
    <br>
    <button onclick="resetTurn()">🔄 Tiếp tục</button>

    <h3>Lịch sử rút bài</h3>
    <ul id="historyList"></ul>

    <p><strong>Bài còn lại: </strong><span id="cardsLeft"></span></p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCig0Z7mku3A0920dAAmJ8QOAGSY2qov34",
      authDomain: "wang-2025.firebaseapp.com",
      databaseURL: "https://wang-2025-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "wang-2025",
      storageBucket: "wang-2025.appspot.com",
      messagingSenderId: "112722745227",
      appId: "1:112722745227:web:133ac984a65668b187018e",
      measurementId: "G-8W4VN0QM5T"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const allCards = [
      { image: "card1.png", question: "Câu hỏi 1: Bạn nghĩ gì về tình yêu đích thực?" },
      { image: "card2.png", question: "Câu hỏi 2: Bạn nghĩ điều quan trọng nhất trong một mối quan hệ là gì?" },
      // Thêm các câu hỏi khác
    ];

    let roomId = "";
    let remainingCards = [...allCards]; // Lưu trữ bài chưa rút
    let history = [];

    function createRoom() {
      const randomId = 'room_' + Math.random().toString(36).substring(2, 8).toUpperCase();
      document.getElementById("roomId").value = randomId;
      joinRoom();
    }

    window.joinRoom = function () {
      roomId = document.getElementById("roomId").value.trim();
      if (!roomId) return alert("Vui lòng nhập mã phòng!");
      document.getElementById("setupArea").classList.add("hidden");
      document.getElementById("gameArea").classList.remove("hidden");
      document.getElementById("roomDisplay").textContent = roomId;

      const roomRef = ref(db, "rooms/" + roomId);
      onValue(roomRef, (snapshot) => {
        const data = snapshot.val();
        if (data) {
          if (data.player1 && data.player1.card) {
            showCard(1, data.player1.card);
          }
          if (data.player2 && data.player2.card) {
            showCard(2, data.player2.card);
          }
        }
      });
    };

    window.drawCard = function(player) {
      if (remainingCards.length === 0) {
        alert("Hết bài rồi!");
        return; // Dừng hàm nếu hết bài
      }

      const cardIndex = Math.floor(Math.random() * remainingCards.length); // Chọn ngẫu nhiên một bài
      const drawnCard = remainingCards.splice(cardIndex, 1)[0]; // Rút bài và loại bỏ khỏi danh sách

      history.push({ player: player === 1 ? "Người chơi 1" : "Người chơi 2", question: drawnCard.question });

      const questionText = drawnCard.question;
      const imgSrc = drawnCard.image;

      // Cập nhật Firebase với thông tin người chơi và bài rút
      const playerRef = ref(db, `rooms/${roomId}/player${player}`);
      set(playerRef, { card: drawnCard });

      updateHistory();  // Cập nhật lịch sử rút bài
      updateCardsLeft();  // Cập nhật số lượng bài còn lại
    };

    function showCard(player, card) {
      if (player === 1) {
        document.getElementById("card1").innerHTML = `<img src="${card.image}" class="card-img" />`;
        document.getElementById("question1").textContent = card.question;
      } else {
        document.getElementById("card2").innerHTML = `<img src="${card.image}" class="card-img" />`;
        document.getElementById("question2").textContent = card.question;
      }
    }

    function updateHistory() {
      const historyList = document.getElementById("historyList");
      historyList.innerHTML = ""; // Xóa danh sách cũ
      history.forEach(item => {
        const li = document.createElement("li");
        li.textContent = `${item.player}: ${item.question}`;
        historyList.appendChild(li);
      });
    }

    function updateCardsLeft() {
      document.getElementById("cardsLeft").textContent = remainingCards.length;
    }

    window.resetTurn = function () {
      document.getElementById("card1").innerHTML = '<img src="back.png" class="card-img" />';
      document.getElementById("card2").innerHTML = '<img src="back.png" class="card-img" />';
      document.getElementById("question1").textContent = "";
      document.getElementById("question2").textContent = "";
    };
  </script>
</body>
</html>
