<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Rút Bài Câu Hỏi</title>
  <style>
    img.card-img {
      width: 120px;
      border: 2px solid #444;
      border-radius: 10px;
      margin-top: 8px;
    }
    #nextBtn {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      display: none;
    }
    .log {
      font-family: monospace;
      margin-top: 20px;
    }
    #gameArea {
      display: none;
    }
    .player-form {
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <h1>🎴 Trò Chơi Rút Bài Câu Hỏi</h1>

  <!-- 🚀 Phần nhập thông tin người chơi -->
  <div id="setupArea">
    <h2>🧑‍🤝‍🧑 Nhập thông tin người chơi</h2>
    <div class="player-form">
      <label>Tên người chơi 1: <input type="text" id="name1" required></label>
      <select id="gender1">
        <option value="Nam">Nam</option>
        <option value="Nữ">Nữ</option>
        <option value="Khác">Khác</option>
      </select>
    </div>
    <div class="player-form">
      <label>Tên người chơi 2: <input type="text" id="name2" required></label>
      <select id="gender2">
        <option value="Nam">Nam</option>
        <option value="Nữ">Nữ</option>
        <option value="Khác">Khác</option>
      </select>
    </div>
    <button onclick="startGame()">🎮 Bắt đầu chơi</button>
  </div>

  <!-- 🎯 Khu vực chơi game -->
  <div id="gameArea">
    <div><strong id="counter">Còn lại: 49 / 49 lá</strong></div>

    <button onclick="drawCard(1)" id="btn1">Người chơi 1 rút</button>
    <div id="card1"><img src="cards/back.png" class="card-img" alt="Bài úp"></div>
    <div id="question1" style="margin: 10px 0; font-weight: bold;"></div>
    <br>

    <button onclick="drawCard(2)" id="btn2">Người chơi 2 rút</button>
    <div id="card2"><img src="cards/back.png" class="card-img" alt="Bài úp"></div>
    <div id="question2" style="margin: 10px 0; font-weight: bold;"></div>
    <br>

    <button id="nextBtn" onclick="resetTurn()">🔄 Chơi Tiếp</button>

    <div class="log">
      <h3>📜 Những Lá Đã Rút:</h3>
      <ul id="drawnLog"></ul>
    </div>
  </div>

  <script>
    const cards = [
      { id: 1, label: "Lá 1", question: "Nếu được du hành thời gian, bạn muốn quay về đâu?", image: "cards/card1.png" },
      { id: 2, label: "Lá 2", question: "Món ăn yêu thích nhất của bạn là gì?", image: "cards/card2.png" },
      { id: 3, label: "Lá 3", question: "Kể một bí mật nhỏ chưa ai biết 😏", image: "cards/card3.png" },
      { id: 4, label: "Lá 4", question: "Điều gì khiến bạn cảm thấy hạnh phúc nhất?", image: "cards/card4.png" },
      // Thêm các lá bài khác nếu cần
    ];

    let drawnCards = [];
    let player1Name, player2Name;
    let remainingCards = [...cards]; // Copy the original cards array

    function startGame() {
      player1Name = document.getElementById("name1").value;
      player2Name = document.getElementById("name2").value;
      if (!player1Name || !player2Name) {
        alert("Bạn cần nhập tên người chơi!");
        return;
      }

      // Ẩn phần nhập thông tin và hiển thị khu vực chơi game
      document.getElementById("setupArea").style.display = "none";
      document.getElementById("gameArea").style.display = "block";
      updateCounter();

      // Mở lại các nút rút bài
      document.getElementById("btn1").disabled = false;
      document.getElementById("btn2").disabled = false;
    }

    function updateCounter() {
      const counter = document.getElementById("counter");
      counter.textContent = `Còn lại: ${remainingCards.length} / 49 lá`;
    }

    function drawCard(player) {
      if (remainingCards.length === 0) {
        alert("Hết bài rồi!");
        return;
      }

      const cardIndex = Math.floor(Math.random() * remainingCards.length);
      const card = remainingCards.splice(cardIndex, 1)[0]; // Rút một lá bài ngẫu nhiên
      drawnCards.push(card);

      // Hiển thị lá bài và câu hỏi
      if (player === 1) {
        document.getElementById("card1").innerHTML = `<img src="${card.image}" class="card-img" alt="${card.label}">`;
        document.getElementById("question1").textContent = card.question;
      } else {
        document.getElementById("card2").innerHTML = `<img src="${card.image}" class="card-img" alt="${card.label}">`;
        document.getElementById("question2").textContent = card.question;
      }

      // Vô hiệu hóa nút rút bài của người chơi
      if (player === 1) {
        document.getElementById("btn1").disabled = true;
      } else {
        document.getElementById("btn2").disabled = true;
      }

      updateCounter();
      checkGameOver();
    }

    function checkGameOver() {
      // Khi cả hai người chơi đã rút bài, hiển thị nút "Tiếp tục chơi"
      if (document.getElementById("btn1").disabled && document.getElementById("btn2").disabled) {
        document.getElementById("nextBtn").style.display = "block";
      }
    }

    function resetTurn() {
      // Reset trò chơi cho lượt tiếp theo
      document.getElementById("card1").innerHTML = '<img src="cards/back.png" class="card-img" alt="Bài úp">';
      document.getElementById("card2").innerHTML = '<img src="cards/back.png" class="card-img" alt="Bài úp">';
      document.getElementById("question1").textContent = "";
      document.getElementById("question2").textContent = "";
      document.getElementById("btn1").disabled = false;
      document.getElementById("btn2").disabled = false;
      document.getElementById("nextBtn").style.display = "none";

      // Cập nhật danh sách những lá bài đã rút
      const drawnLog = document.getElementById("drawnLog");
      drawnLog.innerHTML = "";
      drawnCards.forEach(card => {
        const listItem = document.createElement("li");
        listItem.textContent = `${card.label}: ${card.question}`;
        drawnLog.appendChild(listItem);
      });
    }
  </script>
</body>
</html>
