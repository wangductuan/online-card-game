<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rút Bài Thấu Hiểu Love Again by Wang 8</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; }
    .card-img { width: 100px; border: 2px solid #444; border-radius: 8px; margin-top: 10px; }
    .hidden { display: none; }
    h1 { margin-bottom: 10px; }
    .description { font-size: 16px; color: #555; margin-bottom: 20px; }
    .spinner { margin-top: 20px; font-size: 18px; background-color: #007BFF; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
    .spinner:hover { background-color: #0056b3; }

    /* Responsive Styles */
    @media (max-width: 600px) {
      .card-img { width: 80px; }
      .description { font-size: 14px; }
    }
  </style>
</head>
<body>
  <h1>🎴 Rút Bài Thấu Hiểu Love Again by Wang 8</h1>
  <p class="description">Trò chơi này giúp bạn và người chơi khám phá những câu hỏi thú vị về tình yêu và sự hiểu biết lẫn nhau. Cùng nhau trải nghiệm và thấu hiểu sâu sắc hơn qua mỗi lá bài.</p>
  
  <div id="setupArea">
    <input type="text" id="roomId" placeholder="Nhập mã phòng (VD: room123)" />
    <button onclick="joinRoom()">Tham gia phòng</button><br><br>
    <button onclick="createRoom()">🎲 Tạo Phòng Ngẫu Nhiên</button>
  </div>
  
  <div id="gameArea" class="hidden">
    <p><strong>Phòng:</strong> <span id="roomDisplay"></span></p>
    
    <button onclick="drawCard(1)">🧔 Anh ấy rút</button>
    <div id="card1"><img src="back.png" class="card-img" /></div>
    <div id="question1"></div>
    <br>
    
    <button onclick="drawCard(2)">👩 Cô ấy rút</button>
    <div id="card2"><img src="back.png" class="card-img" /></div>
    <div id="question2"></div>
    <br>
    
    <button onclick="resetTurn()">🔄 Tiếp tục</button>
    
    <button class="spinner" onclick="spinWheel()">🎰 Quay vòng lựa chọn người rút</button>
    <div id="spinnerResult" style="margin-top: 20px; font-size: 20px; font-weight: bold;"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCig0Z7mku3A0920dAAmJ8QOAGSY2qov34",
      authDomain: "wang-2025.firebaseapp.com",
      databaseURL: "https://wang-2025-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "wang-2025",
      storageBucket: "wang-2025.appspot.com",
      messagingSenderId: "112722745227",
      appId: "1:112722745227:web:133ac984a65668b187018e",
      measurementId: "G-8W4VN0QM5T"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const allCards = [
      { id: 1, label: "Lá 1", question: "Nếu chúng ta có thể đi du lịch đâu đó, bạn muốn đi đâu?", image: "cards/card1.png" },
      { id: 2, label: "Lá 2", question: "Món ăn yêu thích nhất của bạn là gì?", image: "cards/card2.png" },
      // Thêm các lá bài còn lại ở đây...
    ];

    let roomId = "";
    let remainingCards = [...allCards];

    function createRoom() {
      const randomId = 'room_' + Math.random().toString(36).substring(2, 8).toUpperCase();
      document.getElementById("roomId").value = randomId;
      joinRoom();
    }

    window.joinRoom = function () {
      roomId = document.getElementById("roomId").value.trim();
      if (!roomId) return alert("Vui lòng nhập mã phòng!");
      document.getElementById("setupArea").classList.add("hidden");
      document.getElementById("gameArea").classList.remove("hidden");
      document.getElementById("roomDisplay").textContent = roomId;

      const roomRef = ref(db, "rooms/" + roomId + "/lastDraw");
      onValue(roomRef, (snapshot) => {
        const data = snapshot.val();
        if (data && data.player && data.card) showCard(data.player, data.card);
      });
    };

    window.drawCard = function(player) {
      if (remainingCards.length === 0) return alert("Hết bài rồi!");
      const idx = Math.floor(Math.random() * remainingCards.length);
      const card = remainingCards.splice(idx, 1)[0];
      set(ref(db, "rooms/" + roomId + "/lastDraw"), { player, card });
    };

    function showCard(player, card) {
      if (player === 1) {
        document.getElementById("card1").innerHTML = `<img src="${card.image}" class="card-img" />`;
        document.getElementById("question1").textContent = card.question;
      } else {
        document.getElementById("card2").innerHTML = `<img src="${card.image}" class="card-img" />`;
        document.getElementById("question2").textContent = card.question;
      }
    }

    window.resetTurn = function () {
      document.getElementById("card1").innerHTML = '<img src="back.png" class="card-img" />';
      document.getElementById("card2").innerHTML = '<img src="back.png" class="card-img" />';
      document.getElementById("question1").textContent = "";
      document.getElementById("question2").textContent = "";
    };

    // Hàm quay vòng lựa chọn
    function spinWheel() {
      const players = ['Anh ấy', 'Cô ấy'];
      const winner = players[Math.floor(Math.random() * players.length)];
      document.getElementById("spinnerResult").textContent = `Người được rút: ${winner}`;
      // Bạn có thể kết hợp với Firebase để lưu kết quả quay
      set(ref(db, "rooms/" + roomId + "/chosenPlayer"), winner);
    }
  </script>
</body>
</html>
